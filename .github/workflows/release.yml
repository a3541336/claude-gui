name: release

# Push a tag like v0.1.0 to build macOS + Windows installers into a draft release.
# Installed apps see the update once the draft is published (they read latest.json
# from the latest published release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # The app's version (shown in the app and written to latest.json for the
      # updater) comes from tauri.conf.json, so set it from the tag: v1.2.3 → 1.2.3.
      # Runs from a branch (workflow_dispatch) keep the versions in the repo.
      - name: Set version from tag
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node --input-type=commonjs - <<'EOF'
          const fs = require("fs");
          const version = process.env.TAG.replace(/^v/, "");
          if (!/^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(version)) {
            console.error(`Tag ${process.env.TAG} is not a version like v1.2.3`);
            process.exit(1);
          }
          for (const file of ["package.json", "src-tauri/tauri.conf.json"]) {
            const json = JSON.parse(fs.readFileSync(file, "utf8"));
            json.version = version;
            fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
          }
          const cargo = "src-tauri/Cargo.toml";
          const toml = fs.readFileSync(cargo, "utf8");
          const updated = toml.replace(/^version = ".*"$/m, `version = "${version}"`);
          if (updated === toml && !toml.includes(`version = "${version}"`)) {
            console.error("No package version found in Cargo.toml");
            process.exit(1);
          }
          fs.writeFileSync(cargo, updated);
          console.log(`Version set to ${version}`);
          EOF

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; the app only installs updates signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FlowLoom ${{ github.ref_name }}"
          releaseDraft: true
          args: ${{ matrix.args }}
